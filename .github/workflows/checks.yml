name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node 24 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PUBLIC_RECIPE_SNAPSHOT_ENABLED: 'false'
      SEO_INDEXING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Collection tests without providers
        run: npm run test:collections
      - name: Ingredient verification tests without providers
        run: npm run test:ingredient-verification
      - name: Retained recipe recovery tests without providers or database
        run: npm run test:result-recovery:unit
      - name: Production build and generated route types
        run: npm run build
      - name: TypeScript
        run: npm run typecheck
